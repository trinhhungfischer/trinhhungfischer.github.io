local_backend: true
backend:
  name: github
  repo: trinhhungfischer/trinhhungfischer.github.io
  branch: master # Branch to update

media_folder: "public/images"
public_folder: "/images"

i18n:
  structure: multiple_files
  locales: [vi, en]
  default_locale: vi

collections:
  - name: "projects"
    label: "Projects"
    files:
      - file: "src/data/projects.json"
        label: "Projects List"
        name: "projects_list"
        widget: "list"
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Slug, name: slug, widget: string}
          - {label: Description, name: description, widget: text}
          - {label: Genres, name: genres, widget: list}
          - {label: Tools, name: tools, widget: list}
          - {label: Start Date, name: startDate, widget: string, required: false}
          - {label: End Date, name: endDate, widget: string, required: false, hint: "Use 'present' or YYYY-MM"}
          - {label: Pinned, name: pinned, widget: boolean, default: false, required: false}
          - {label: Color, name: colorClass, widget: select, options: ["color-block-1", "color-block-2", "color-block-3", "color-block-4"]}
          - {label: Type, name: type, widget: select, options: ["company", "personal"], default: "company"}
          - {label: Image Text, name: imagePlaceholder, widget: string, required: false}
          - {label: Image, name: imageUrl, widget: image, required: false}

  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blogs"
    create: true
    slug: "{{slug}}"
    media_folder: "{{media_folder}}/blogs/{{slug}}"
    public_folder: "{{public_folder}}/blogs/{{slug}}"
    i18n: true
    fields:
      - {label: "Title", name: "title", widget: "string", i18n: true}
      - {label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, i18n: duplicate}
      - {label: "Category", name: "category", widget: "string", i18n: true}
      - {label: "Excerpt", name: "excerpt", widget: "text", i18n: true}
      - {label: "Color", name: "color", widget: "select", options: ["var(--pale-blue)", "var(--pale-yellow)", "var(--pale-green)", "var(--pale-pink)", "var(--pale-orange)"], i18n: duplicate}
      - {label: "Body", name: "body", widget: "markdown", i18n: true}
